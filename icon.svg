<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </radialGradient>
    <linearGradient id="neonEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="rgba(52, 211, 153, 0.25)" stroke-width="4"/>

  <!-- Glowing Center Reset Ring -->
  <g filter="url(#glow)">
    <!-- Circular track -->
    <circle cx="256" cy="256" r="160" fill="none" stroke="rgba(51, 65, 85, 0.4)" stroke-width="18" stroke-linecap="round"/>
    
    <!-- Neon Reset Arc -->
    <path d="M 256 96 A 160 160 0 1 1 110 324" fill="none" stroke="url(#neonEmerald)" stroke-width="20" stroke-linecap="round"/>
    
    <!-- Arrowhead at arc top -->
    <polygon points="256,76 286,96 256,116" fill="#34d399"/>
  </g>

  <!-- Neuro / Brain Synapse Nodes -->
  <g fill="#f1f5f9">
    <!-- Center Core -->
    <circle cx="256" cy="256" r="28" fill="#10b981" filter="url(#glow)"/>
    <circle cx="256" cy="256" r="14" fill="#ffffff"/>
    
    <!-- Left Hemispheric Synapses -->
    <circle cx="196" cy="216" r="12" fill="#22d3ee"/>
    <circle cx="180" cy="276" r="10" fill="#34d399"/>
    <circle cx="216" cy="316" r="11" fill="#06b6d4"/>

    <!-- Right Hemispheric Synapses -->
    <circle cx="316" cy="216" r="12" fill="#22d3ee"/>
    <circle cx="332" cy="276" r="10" fill="#34d399"/>
    <circle cx="296" cy="316" r="11" fill="#06b6d4"/>

    <!-- Neural Connecting Strands -->
    <path d="M 256 256 L 196 216 M 256 256 L 180 276 M 256 256 L 216 316 M 256 256 L 316 216 M 256 256 L 332 276 M 256 256 L 296 316 M 196 216 L 180 276 M 316 216 L 332 276" 
          stroke="rgba(255, 255, 255, 0.45)" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Bottom Pulse Bar -->
  <path d="M 176 390 L 216 390 L 236 360 L 256 420 L 276 376 L 296 390 L 336 390" 
        fill="none" stroke="#34d399" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
</svg>
